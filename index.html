<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard BIP · Análisis de rugby</title>
<style>

*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}

.btn.d{color:#dc2626}.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:#fef3c7;color:#92400e}

.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;min-width:0}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
th{cursor:pointer;color:var(--m);font-size:12px;text-transform:uppercase;user-select:none}
.ch{width:100%;height:auto}.ch text{fill:var(--m);font-size:10px}.seg{display:inline-flex;gap:4px}.seg button{border:1px solid var(--b);background:var(--c);color:var(--t);padding:6px 14px;border-radius:8px;cursor:pointer}
.drop{border:2px dashed var(--m);border-radius:12px;padding:26px;text-align:center;margin-bottom:12px}.drop.o{background:rgba(37,99,235,.1)}

.er{color:#dc2626}.wr{color:#b45309;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.lg span{display:inline-block;margin-right:12px;font-size:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
</style></head><body>
<header><h1>🏉 Dashboard BIP</h1><nav id="nav"></nav><span id="mode"></span></header>
<main id="app"></main>
<script>
const $=(s)=>document.querySelector(s),KEY='bipdash.v1',TABS=[['res','Resumen de temporada'],['rev','Review del partido'],['cmp','Comparación'],['gest','Gestión de partidos'],['sh','Compartir dashboard']];
const PAL=['#2563eb','#16a34a','#ea580c','#7c3aed','#db2777','#0891b2','#ca8a04'];
const KEEP=['entity_type','task_id','task_name','bip_id','bip_name','ruck_id','ruck_count','start_time_unix_ms','start_time_seconds','end_time_seconds','duration_seconds','pre_dead_ball_seconds','post_dead_ball_seconds'];
const REQ=['activity_id','activity_name','entity_type','task_id','task_name','bip_id','bip_name','ruck_id','ruck_count','start_time_unix_ms','end_time_unix_ms','start_time_seconds','end_time_seconds','duration_seconds','pre_dead_ball_seconds','post_dead_ball_seconds'];
let S={matches:[]},VIS=new URLSearchParams(location.search).get('modo')==='visitante',tab='res',sel=null,view='task',cmp=new Set(),cf={q:'',a:'',b:''},P=[],ERR='';
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0),uq=(a,k)=>{const s=new Set();return a.filter(x=>x[k]&&!s.has(x[k])&&s.add(x[k]))};
const p2=n=>String(n).padStart(2,'0'),f=s=>{s=Math.floor(s||0);const h=s/3600|0;return(h?p2(h)+':':'')+p2((s%3600)/60|0)+':'+p2(s%60)},pc=x=>Math.round(x*100)+'%',r1=x=>Math.round(x*10)/10;
const med=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};

const DE=[30,60,90,120,180],DL=['0-30','31-60','61-90','91-120','121-180','181+'],RE=[3,6,9,12,15],RL=['0-3','4-6','7-9','10-12','13-15','16+'],TE=[3,6,9,12,15,30,60,90],TL=['0-3','4-6','7-9','10-12','13-15','16-30','31-60','61-90','91+'];

/* ---------- CSV + normalización ---------- */
function parseCSV(t){const R=[];let r=[],c='',q=0;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')R.push(r);r=[]}else c+=h}if(c!==''||r.length){r.push(c);R.push(r)}return R}
const num=v=>{if(v===''||v==null)return null;const n=+v;return isNaN(n)?null:n};
function toMatch(txt,file){const R=parseCSV(txt),o={file,warn:[]};if(R.length<2){o.err='El archivo está vacío o no tiene filas de datos.';return o}
const H=R[0].map(h=>h.trim()),miss=REQ.filter(c=>!H.includes(c));if(miss.length){o.err='Formato incompatible. Faltan columnas: '+miss.join(', ');return o}
const rows=R.slice(1).filter(r=>r.length>=H.length-2).map(r=>{const x={};H.forEach((h,i)=>x[h]=r[i]);return x});
const bad=rows.filter(r=>!['task','bip','ruck'].includes(r.entity_type));if(bad.length){o.err=`Hay ${bad.length} filas con entity_type desconocido (esperado task, bip o ruck).`;return o}
const ids=[...new Set(rows.map(r=>r.activity_id))];if(ids.length!=1){o.err='El archivo debe contener una única actividad (activity_id). Encontradas: '+ids.length;return o}
const NUM=['ruck_count','start_time_unix_ms','start_time_seconds','end_time_seconds','duration_seconds','pre_dead_ball_seconds','post_dead_ball_seconds'];
let k=rows.map(r=>{const x={};KEEP.forEach(c=>x[c]=NUM.includes(c)?num(r[c]):(r[c]===''?null:r[c]));return x});
const tasks=k.filter(r=>r.entity_type=='task');if(!tasks.length){o.err='No hay registros task.';return o}
if(tasks.some(t=>t.start_time_seconds==null||t.end_time_seconds==null||t.duration_seconds==null)){o.err='Hay tareas sin tiempos válidos.';return o}
const tid=new Set(tasks.map(t=>t.task_id)),b=k.filter(r=>r.entity_type=='bip');
if(b.some(x=>!tid.has(x.task_id))){o.err='Hay BIP que apuntan a una tarea inexistente (task_id).';return o}
['bip','ruck'].forEach(e=>{const a=k.filter(r=>r.entity_type==e),u=uq(a,e+'_id');if(u.length<a.length){o.warn.push(`${a.length-u.length} registros ${e} con ${e}_id repetido: se han ignorado los duplicados.`)}});
k=k.filter((r,i)=>{if(r.entity_type=='task')return true;const key=r.entity_type+'_id';return k.findIndex(z=>z.entity_type==r.entity_type&&z[key]==r[key])==i});
const ru=k.filter(r=>r.entity_type=='ruck').length,rc=sum(tasks,'ruck_count');if(ru!=rc)o.warn.push(`Filas ruck (${ru}) ≠ suma de ruck_count en tareas (${rc}). El dashboard usa ruck_count de cada tarea, como Review.`);
const t0=[...tasks].sort((a,b)=>a.start_time_seconds-b.start_time_seconds)[0],d=t0.start_time_unix_ms?new Date(t0.start_time_unix_ms):null;
o.m={id:uid(),activityId:ids[0],name:rows[0].activity_name||file.replace(/\.csv$/i,''),rival:'',date:d?`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`:'',startMs:t0.start_time_unix_ms,file,added:new Date().toISOString(),rows:k};return o}
/* ---------- cálculo (ver README: fórmulas) ---------- */
const CA=new WeakMap();
function calc(m){if(CA.has(m))return CA.get(m);const T=m.rows.filter(r=>r.entity_type=='task').sort((a,b)=>a.start_time_seconds-b.start_time_seconds),B=uq(m.rows.filter(r=>r.entity_type=='bip'),'bip_id'),RK=uq(m.rows.filter(r=>r.entity_type=='ruck'),'ruck_id');
const tasks=T.map(t=>{const bips=B.filter(x=>x.task_id==t.task_id),work=sum(bips,'duration_seconds'),rucks=t.ruck_count??RK.filter(r=>r.task_id==t.task_id).length;return{name:t.task_name,start:t.start_time_seconds,end:t.end_time_seconds,dur:t.duration_seconds,work,rest:t.duration_seconds-work,pct:t.duration_seconds?work/t.duration_seconds:0,nb:bips.length,rucks,out:rucks-sum(bips,'ruck_count'),bips}});
let gap=0;for(let i=1;i<tasks.length;i++)gap+=Math.max(0,tasks[i].start-tasks[i-1].end);
const win=a=>a.length?a[a.length-1].end-a[0].start:0,bt=tasks.filter(t=>t.nb),wT=win(tasks),wB=win(bt),bip=sum(B,'duration_seconds'),taskTime=sum(tasks,'dur'),dur=B.map(x=>x.duration_seconds||0);
const c={tasks,B,bip,taskTime,gap,wT,wB,restB:wB-bip,bipPct:wB?bip/wB:0,taskPct:wT?taskTime/wT:0,rucks:sum(tasks,'rucks'),clock:Math.ceil(Math.max(...m.rows.map(r=>r.end_time_seconds||0))),dur,mean:dur.length?bip/dur.length:0,med:med(dur),sd:sd(dur),rpm:wB?sum(tasks,'rucks')/(wB/60):0};CA.set(m,c);return c}
const lbl=m=>(m.date?m.date.slice(8)+'/'+m.date.slice(5,7)+' ':'')+m.name.slice(0,16),srt0=a=>[...a].sort((x,y)=>(x.date||'9').localeCompare(y.date||'9')||x.added?.localeCompare(y.added));
/* ---------- gráficos SVG ---------- */
function bars(L,ser,fmt=r1){const W=560,H=170,P0=30,mx=Math.max(1,...ser.flatMap(s=>s.v)),g=(W-P0)/L.length,bw=g*.8/ser.length;let o=`<svg class="ch" viewBox="0 0 ${W} ${H+34}">`;
for(let i=0;i<=3;i++){const y=14+H-H*i/3;o+=`<line x1="${P0}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".12"/><text x="0" y="${y+3}">${fmt(mx*i/3)}</text>`}
L.forEach((l,i)=>{ser.forEach((s,j)=>{const h=s.v[i]/mx*H,x=P0+i*g+g*.1+j*bw;o+=`<rect x="${x}" y="${14+H-h}" width="${Math.max(1,bw-1)}" height="${h}" fill="${s.c}" rx="2"><title>${ESC(s.n)} · ${ESC(l)}: ${fmt(s.v[i])}</title></rect>`;if(ser.length*L.length<=16)o+=`<text x="${x+bw/2}" y="${11+H-h}" text-anchor="middle">${fmt(s.v[i])}</text>`});o+=`<text x="${P0+i*g+g/2}" y="${H+28}" text-anchor="middle">${ESC(l.length>12?l.slice(0,11)+'…':l)}</text>`});return o+'</svg>'}
function line(L,v,c,fmt=r1){const W=560,H=150,P0=34,mx=Math.max(1e-9,...v),n=L.length,X=i=>P0+(n>1?i*(W-P0-14)/(n-1):(W-P0)/2),Y=x=>14+H-x/mx*H;let o=`<svg class="ch" viewBox="0 0 ${W} ${H+34}"><line x1="${P0}" x2="${W}" y1="${14+H}" y2="${14+H}" stroke="currentColor" opacity=".2"/><text x="0" y="20">${fmt(mx)}</text><text x="0" y="${H+14}">0</text><polyline fill="none" stroke="${c}" stroke-width="2.5" points="${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}"/>`;
v.forEach((x,i)=>{o+=`<circle cx="${X(i)}" cy="${Y(x)}" r="4" fill="${c}"><title>${ESC(L[i])}: ${fmt(x)}</title></circle><text x="${X(i)}" y="${Y(x)-8}" text-anchor="middle">${fmt(x)}</text><text x="${X(i)}" y="${H+30}" text-anchor="middle">${ESC(L[i].slice(0,10))}</text>`});return o+'</svg>'}
const ring=p=>`<svg width="84" height="84" viewBox="0 0 84 84" style="margin:4px auto;display:block"><circle cx="42" cy="42" r="34" fill="none" stroke="currentColor" opacity=".12" stroke-width="8"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--bip)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${Math.min(1,p)*213.6} 213.6" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" style="font:600 16px system-ui;fill:currentColor">${pc(p)}</text></svg>`;
const kp=(a,b,c)=>`<div class="card k"><small>${a}</small>${String(b).startsWith("<svg")?b:`<b>${b}</b>`}<span class="m">${c}</span></div>`,card=(t,x)=>`<div class="card"><h2>${t}</h2>${x}</div>`;
/* ---------- tablas ordenables ---------- */
const TB={};function tbl(id,cols,rows){TB[id]=Object.assign(TB[id]||{s:-1,d:1},{cols,rows});return`<div class="tw" id="${id}">${tbH(id)}</div>`}
function tbH(id){const t=TB[id];let r=[...t.rows];if(t.s>=0){const k=t.cols[t.s].k;r.sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*t.d)}return`<table><thead><tr>${t.cols.map((c,i)=>`<th onclick="srt('${id}',${i})">${c.h}${t.s==i?(t.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${t.cols.map(c=>`<td>${c.f?c.f(x):ESC(x[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function srt(id,i){const t=TB[id];t.d=t.s==i?-t.d:1;t.s=i;$('#'+id).innerHTML=tbH(id)}
/* ---------- vistas ---------- */
const sm=m=>{const c=calc(m);return{id:m.id,date:m.date,name:m.name,rival:m.rival,clock:c.clock,bip:c.bip,rest:c.restB,pct:c.bipPct,rucks:c.rucks,nt:c.tasks.length,rpm:c.rpm,mean:c.mean,nb:c.B.length}};
const SC=[{h:'Fecha',k:'date'},{h:'Partido',k:'name'},{h:'Rival',k:'rival'},{h:'Sesión',k:'clock',f:x=>f(x.clock)},{h:'BIP Time',k:'bip',f:x=>f(x.bip)},{h:'Rest',k:'rest',f:x=>f(x.rest)},{h:'BIP %',k:'pct',f:x=>pc(x.pct)},{h:'Rucks',k:'rucks'},{h:'Tareas',k:'nt'}];
function vRes(){const M=srt0(S.matches),R=M.map(sm),C=M.map(calc),L=M.map(lbl),w=C.reduce((s,c)=>s+c.wB,0),bip=C.reduce((s,c)=>s+c.bip,0);
const all=C.flatMap(c=>c.dur);
return`<div class="g">${kp('Partidos',M.length,'registrados')}${kp('BIP Time',f(bip),'acumulado')}${kp('Rest',f(w-bip),'acumulado')}${kp('BIP %',ring(w?bip/w:0),'global (BIP / ventana BIP)')}${kp('Rucks',R.reduce((s,x)=>s+x.rucks,0),'totales')}${kp('Clock',f(R.reduce((s,x)=>s+x.clock,0)),'sesiones acumuladas')}</div>
<div class="g2">${card('Evolución del BIP %',line(L,R.map(x=>x.pct*100),'var(--bip)',x=>Math.round(x)+'%'))}${card('Evolución del tiempo BIP (min)',line(L,R.map(x=>x.bip/60),'var(--bip)'))}${card('Evolución del descanso (min)',line(L,R.map(x=>x.rest/60),'var(--rest)'))}${card('Evolución de rucks',line(L,R.map(x=>x.rucks),'var(--ruck)',Math.round))}
${card('Distribución de duraciones BIP (todos los partidos)',bars(DL,[{n:'BIP',c:'var(--bip)',v:hist(all,DE)}],Math.round))}${card('Comparación entre encuentros (min)',bars(L,[{n:'BIP',c:'var(--bip)',v:R.map(x=>x.bip/60)},{n:'Rest',c:'var(--rest)',v:R.map(x=>x.rest/60)}])+'<div class="lg"><span><i style="background:var(--bip)"></i>BIP</span><span><i style="background:var(--rest)"></i>Rest</span></div>')}</div>
${card('Histórico de partidos',tbl('t-hist',SC,R))}`}
function cur(){return S.matches.find(m=>m.id==sel)||srt0(S.matches)[0]}
function vRev(){const m=cur(),c=calc(m),B=view=='bip',d=new Date(m.startMs||0);
const cards=B?[['BIP Time',f(c.bip),'Balón en juego total'],['Rest',f(c.restB),'Balón parado / recuperación'],['BIP %',ring(c.bipPct),'BIP sobre ventana de tareas con BIP']]:[['Task time',f(c.taskTime),'Ventanas de drill totales'],['Gap rest',f(c.gap),'Balón parado entre tareas'],['Task %',ring(c.taskPct),'Tiempo de tarea / ventana']];
cards.push(['Rucks',c.rucks,'Rucks totales'],['Clock',f(c.clock),'Cronómetro de sesión (aprox.)']);
const rb=B?hist(c.B.map(x=>x.ruck_count||0),RE):hist(c.tasks.map(t=>t.rucks),TE),rl=B?RL:TL,ch=(L,v)=>`<div style="display:flex;gap:6px;flex-wrap:wrap">${L.map((l,i)=>`<div class="card k" style="padding:8px 12px"><small>${l}</small><b style="font-size:20px;margin:4px 0">${v[i]}</b></div>`).join('')}</div>`;
const rows=c.tasks.map(t=>({...t,tot:t.dur}));
return`<div class="row"><select onchange="sel=this.value;render()">${srt0(S.matches).map(x=>`<option value="${x.id}" ${x.id==m.id?'selected':''}>${ESC(lbl(x))}</option>`).join('')}</select><div class="seg"><button class="${B?'':'on'}" onclick="view='task';render()">Task</button><button class="${B?'on':''}" onclick="view='bip';render()">BIP</button></div></div>
<div class="g" style="grid-template-columns:2fr repeat(5,1fr)"><div class="card" style="grid-column:span 1"><small class="m">CURRENT SESSION REVIEW</small><h2 style="font-size:24px;margin:8px 0">${ESC(m.name)}</h2><div class="m">${m.startMs?'Inicio '+d.toLocaleString('es-ES',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Fecha: '+ESC(m.date||'—')}<br>${c.tasks.length} drills · ${c.B.length} BIPs · ventana ${B?'BIP':'de tareas'} ${f(B?c.wB:c.wT)}</div><div class="note">${B?'La vista BIP cuenta el balón parado dentro de los drills como descanso y solo usa las tareas con BIP para el denominador.':'La vista Task cuenta las ventanas de tarea como trabajo y los huecos entre tareas como balón parado.'}</div></div>${cards.map(x=>kp(...x)).join('')}</div>
<div class="g2">${card('Ball In Play Durations (s)',ch(DL,hist(c.dur,DE))+bars(DL,[{n:'BIPs',c:'var(--bip)',v:hist(c.dur,DE)}],Math.round)+`<div class="m">Media ${r1(c.mean)} s · Mediana ${r1(c.med)} s · Desv. típica ${r1(c.sd)} s · ${c.B.length} BIPs</div>`)}${card(B?'Ruck Counts Per BIP':'Ruck Counts Per Task',ch(rl,rb)+bars(rl,[{n:'Rucks',c:'var(--ruck)',v:rb}],Math.round))}</div>

<details class="card"><summary><b>Verificación frente a Review</b></summary><p class="m">Verificado con capturas de Review (J1 CRM vs Escorionas): Task time, Gap rest, Task %, BIP Time, Rest, BIP %, Work/Rest/BIP %/Total por drill, "starts", rucks y los tramos 0-30…121-180 de duraciones BIP y 0-3…13-15 de rucks por BIP. <b>No verificado</b>: tramos posteriores de los histogramas (181+, 16+ y los de rucks por task), y el Clock, que aquí es el último instante registrado redondeado hacia arriba (puede diferir ±1 s). Los segundos se muestran truncados, como en Review.</p></details>`}
function vCmp(){const F=srt0(S.matches).filter(m=>(!cf.q||(m.name+m.rival).toLowerCase().includes(cf.q.toLowerCase()))&&(!cf.a||m.date>=cf.a)&&(!cf.b||m.date<=cf.b));
const M=F.filter(m=>cmp.has(m.id)),R=M.map(sm),L=M.map(lbl);
const ctl=`<div class="card"><div class="row"><input placeholder="Buscar rival o partido" value="${ESC(cf.q)}" onchange="cf.q=this.value;render()"> Desde <input type="date" value="${cf.a}" onchange="cf.a=this.value;render()"> Hasta <input type="date" value="${cf.b}" onchange="cf.b=this.value;render()"></div><div class="row">${F.map(m=>`<label><input type="checkbox" ${cmp.has(m.id)?'checked':''} onchange="this.checked?cmp.add('${m.id}'):cmp.delete('${m.id}');render()"> ${ESC(lbl(m))}</label>`).join('')||'<span class="m">Sin partidos con esos filtros.</span>'}</div></div>`;

const mk=(a,fm)=>R.map(a),dist=M.map(m=>{const d=calc(m).dur,h=hist(d,DE);return h.map(x=>d.length?x/d.length*100:0)});
const tr=M.flatMap(m=>calc(m).tasks.map((t,i)=>({m:lbl(m),i:i+1,n:t.name,w:t.work,r:t.rest,p:t.pct,k:t.rucks})));
return ctl+`<div class="g2">${card('BIP %',bars(L,[{n:'BIP %',c:'var(--bip)',v:R.map(x=>x.pct*100)}],x=>Math.round(x)+'%'))}${card('BIP Time vs Rest (min)',bars(L,[{n:'BIP',c:'var(--bip)',v:R.map(x=>x.bip/60)},{n:'Rest',c:'var(--rest)',v:R.map(x=>x.rest/60)}]))}${card('Rucks totales y por minuto de ventana BIP',bars(L,[{n:'Rucks',c:'var(--ruck)',v:R.map(x=>x.rucks)},{n:'Rucks/min',c:'#c4b5fd',v:R.map(x=>x.rpm)}]))}${card('Distribución de duraciones BIP (% de BIPs)',bars(DL,M.map((m,i)=>({n:lbl(m),c:PAL[i%7],v:dist[i]})),x=>Math.round(x)+'%')+'<div class="lg">'+M.map((m,i)=>`<span><i style="background:${PAL[i%7]}"></i>${ESC(lbl(m))}</span>`).join('')+'</div>')}</div>
${card('Métricas (valores absolutos y tasas)',tbl('t-cmp',[...SC.slice(0,3),{h:'BIP Time',k:'bip',f:x=>f(x.bip)},{h:'Rest',k:'rest',f:x=>f(x.rest)},{h:'BIP %',k:'pct',f:x=>pc(x.pct)},{h:'Rucks',k:'rucks'},{h:'Rucks/min',k:'rpm',f:x=>r1(x.rpm)},{h:'BIPs',k:'nb'},{h:'Media BIP (s)',k:'mean',f:x=>r1(x.mean)}],R))}
${card('Tareas (emparejadas por orden de aparición: solo comparables si los partidos tienen las mismas partes)',tbl('t-ct',[{h:'Partido',k:'m'},{h:'Nº',k:'i'},{h:'Tarea',k:'n'},{h:'Work',k:'w',f:x=>f(x.w)},{h:'Rest',k:'r',f:x=>f(x.r)},{h:'BIP %',k:'p',f:x=>pc(x.p)},{h:'Rucks',k:'k'}],tr))}`}
function vGest(){const dz=`<div class="drop" id="dz" ondragover="event.preventDefault();this.classList.add('o')" ondragleave="this.classList.remove('o')" ondrop="event.preventDefault();addFiles(event.dataTransfer.files)">Arrastra aquí uno o varios CSV de Ball In Play Logger<br><br><label class="btn p">Seleccionar archivos<input type="file" accept=".csv,text/csv" multiple hidden onchange="addFiles(this.files)"></label></div>`;
const pv=P.map((r,i)=>{if(r.err)return`<div class="card er">❌ <b>${ESC(r.file)}</b>: ${ESC(r.err)} <button class="btn" onclick="P.splice(${i},1);render()">Quitar</button></div>`;const m=r.m,c=calc(m),dup=S.matches.find(x=>x.activityId==m.activityId)||S.matches.find(x=>x.name==m.name&&x.date==m.date);r.dup=dup?.id;
return`<div class="card"><b>${ESC(r.file)}</b><div class="m">${m.rows.length} filas · ${c.tasks.length} tareas · ${c.B.length} BIP · ${c.rucks} rucks · BIP ${f(c.bip)} · BIP % ${pc(c.bipPct)}</div>${r.warn.map(w=>`<div class="wr">⚠ ${ESC(w)}</div>`).join('')}<div class="row"><input value="${ESC(m.name)}" placeholder="Nombre" onchange="P[${i}].m.name=this.value"><input value="${ESC(m.rival)}" placeholder="Rival" onchange="P[${i}].m.rival=this.value"><input type="date" value="${m.date}" onchange="P[${i}].m.date=this.value"></div>${dup?`<div class="wr">⚠ Posible duplicado de «${ESC(S.matches.find(x=>x.id==dup).name)}» (misma actividad o mismo nombre y fecha). <select onchange="P[${i}].act=this.value"><option value="cancel">Cancelar</option><option value="upd" ${r.act=='upd'?'selected':''}>Actualizar el existente</option><option value="both" ${r.act=='both'?'selected':''}>Conservar ambas versiones</option></select></div>`:''}<button class="btn" onclick="P.splice(${i},1);render()">Descartar</button></div>`}).join('');
const ok=P.some(r=>!r.err);
return dz+pv+(ok?`<div class="row"><button class="btn p" onclick="confirmImp()">Confirmar importación</button><button class="btn" onclick="P=[];render()">Descartar todo</button></div>`:'')+card(`Partidos guardados (${S.matches.length})`,S.matches.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Nombre</th><th>Rival</th><th>Archivo</th><th></th></tr></thead><tbody>${srt0(S.matches).map(m=>`<tr><td><input type="date" value="${m.date}" onchange="ed('${m.id}','date',this.value)"></td><td><input value="${ESC(m.name)}" onchange="ed('${m.id}','name',this.value)"></td><td><input value="${ESC(m.rival)}" onchange="ed('${m.id}','rival',this.value)"></td><td class="m">${ESC(m.file)}</td><td><button class="btn d" onclick="del('${m.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<span class="m">Aún no hay partidos.</span>')}
async function addFiles(fs){for(const fl of fs)P.push(toMatch(await fl.text(),fl.name));render()}
function confirmImp(){let n=0;P.forEach(r=>{if(r.err)return;const i=S.matches.findIndex(x=>x.id==r.dup);if(r.dup&&(r.act||'cancel')=='cancel')return;if(r.dup&&r.act=='upd')S.matches[i]={...r.m,id:S.matches[i].id};else{if(r.dup&&S.matches.some(x=>x.name==r.m.name))r.m.name+=' (v2)';S.matches.push(r.m)}n++});P=[];save();render();if(n)alert(n+' partido(s) importado(s).')}
function ed(id,k,v){S.matches.find(m=>m.id==id)[k]=v;save()}
function del(id){const m=S.matches.find(x=>x.id==id);if(confirm(`¿Eliminar «${m.name}»? Esta acción no se puede deshacer (haz antes una copia JSON si dudas).`)){S.matches=S.matches.filter(x=>x.id!=id);cmp.delete(id);save();render()}}
const dl=(n,t,mt)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:mt}));a.download=n;a.click()},q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function expJSON(all){const ids=[...document.querySelectorAll('.shr:checked')].map(x=>x.value),M=all?S.matches:S.matches.filter(m=>ids.includes(m.id));if(!M.length)return alert('No hay partidos seleccionados.');dl(all?'bip-dashboard-copia.json':'season.json',JSON.stringify({format:'bip-dashboard',version:1,exported:new Date().toISOString(),matches:M}),'application/json')}
function expCSV(full){const M=srt0(S.matches);dl(full?'bip-datos-completos.csv':'bip-resumen-partidos.csv',full?[['partido',...KEEP].join(','),...M.flatMap(m=>m.rows.map(r=>[q(m.name),...KEEP.map(k=>q(r[k]))].join(',')))].join('\n'):[['fecha','partido','rival','sesion_s','bip_s','rest_s','bip_pct','rucks','tareas'].join(','),...M.map(m=>{const x=sm(m);return[x.date,q(x.name),q(x.rival),x.clock,r1(x.bip),r1(x.rest),r1(x.pct*100),x.rucks,x.nt].join(',')})].join('\n'),'text/csv')}
function impJSON(fl){const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(j.format!='bip-dashboard'||!Array.isArray(j.matches)||j.matches.some(m=>!m.id||!Array.isArray(m.rows)))throw 0;const rep=document.querySelector('input[name=imm]:checked').value=='rep';if(rep&&!confirm('Se reemplazará TODO el histórico actual por la copia. ¿Continuar?'))return;if(rep)S.matches=j.matches;else{const ids=new Set(S.matches.map(m=>m.id));S.matches.push(...j.matches.filter(m=>!ids.has(m.id)))}save();render();alert('Copia importada: '+S.matches.length+' partidos.')}catch(e){alert('Archivo no válido: no es una copia JSON de este dashboard.')}};rd.readAsText(fl)}
function vSh(){const url=/^http/.test(location.protocol)?location.origin+location.pathname:'',vurl=url+'?modo=visitante';
return card('A. Compartir la aplicación (enlace)',url?`<div class="row"><input id="u1" readonly style="flex:1" value="${url}"><button class="btn" onclick="cp('u1')">Copiar</button><a class="btn" href="${url}" target="_blank">Abrir</a></div><div class="row"><input id="u2" readonly style="flex:1" value="${vurl}"><button class="btn" onclick="cp('u2')">Copiar enlace de visitante</button></div><p class="m">El enlace abre la aplicación vacía en cada navegador: <b>no comparte tus datos</b>. El enlace de visitante muestra solo lo que hayas publicado en <code>season.json</code>.</p>`:'<p class="m">Esta copia está abierta como archivo local, así que aún no tiene URL pública. Publícala siguiendo el README (GitHub Pages / Netlify / Vercel) y aquí aparecerán tus enlaces.</p>')+
(!VIS?card('B. Compartir los datos de la temporada',`<p class="m">Los datos viven en este navegador. Para compartirlos: exporta un JSON y envíalo (otro entrenador lo importa aquí) o publícalo como <code>season.json</code> junto a la web para el modo visitante. Solo se comparte lo que marques.</p><div class="row">${srt0(S.matches).map(m=>`<label><input type="checkbox" class="shr" value="${m.id}" checked> ${ESC(lbl(m))}</label>`).join('')}</div><div class="row"><button class="btn p" onclick="expJSON(0)">Exportar JSON de los marcados (season.json)</button><button class="btn" onclick="expJSON(1)">Copia de seguridad completa (JSON)</button><button class="btn" onclick="expCSV(0)">CSV resumen</button><button class="btn" onclick="expCSV(1)">CSV datos completos</button></div><div class="row"><label><input type="radio" name="imm" value="mrg" checked> Fusionar</label><label><input type="radio" name="imm" value="rep"> Reemplazar todo</label><label class="btn">Importar JSON…<input type="file" accept=".json" hidden onchange="impJSON(this.files[0])"></label></div>`)+card('C. Permisos',`<p><b>Propietario</b> (enlace normal): importa, edita, elimina y restaura copias, sobre los datos de su navegador.<br><b>Visitante</b> (<code>?modo=visitante</code>): solo lectura, y solo ve el <code>season.json</code> publicado.</p><p class="wr">Limitación: es una web estática sin servidor. El modo visitante evita ediciones accidentales, pero no es un control de acceso seguro: cualquiera que pueda abrir la web puede leer <code>season.json</code>. No publiques en <code>season.json</code> nada que deba ser privado; para permisos reales haría falta un backend con autenticación (p. ej. Supabase o Firebase).</p>`):card('Datos',`<div class="row"><button class="btn" onclick="expCSV(0)">CSV resumen</button><button class="btn" onclick="expCSV(1)">CSV datos completos</button></div>`))}
